name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy -diff
      - name: gofmt
        run: make fmt
      - name: go vet
        run: make vet
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race ./...

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: typecheck
        run: npx --yes --package typescript@7.0.2 -- tsc -p mod
      - name: install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.301
      - name: claude plugin validate
        run: claude plugin validate .
      - name: claude plugin test
        run: claude plugin test mod

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nix build
        run: nix build .#wakewire --print-build-logs
      - name: the flake's binary runs
        run: ./result/bin/wakewire version --json

