# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: wakewire

builds:
  - id: wakewire
    main: ./cmd/wakewire
    binary: wakewire
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }} -X main.commit={{ .FullCommit }}

archives:
  - id: wakewire
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Release notes are the Conventional Commits since the previous tag.
changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^.*?(test|chore\(deps\)|style)(\(.+\))??!?:.+$'

release:
  prerelease: auto
