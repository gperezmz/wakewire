# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: wakewire

builds:
  - id: wakewire
    main: ./cmd/wakewire
    binary: wakewire
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }} -X main.commit={{ .FullCommit }}

archives:
  - id: wakewire
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Release notes are the Conventional Commits since the previous tag.
changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^.*?(test|chore\(deps\)|style)(\(.+\))??!?:.+$'

release:
  prerelease: auto

# A Homebrew cask, served from this repository as its own tap, for macOS and
# Linux: `brew tap gperezmz/wakewire https://github.com/gperezmz/wakewire`.
# The release job's GITHUB_TOKEN pushes Casks/wakewire.rb to main.
homebrew_casks:
  - name: wakewire
    binaries: [wakewire]
    repository:
      owner: gperezmz
      name: wakewire
      branch: main
    directory: Casks
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "chore(brew): update wakewire to {{ .Tag }}"
    homepage: https://github.com/gperezmz/wakewire
    description: Wakes an agent session when what it waits on changes on GitHub, GitLab or Jira
    skip_upload: false
    # The binaries are not signed by Apple: without this, Gatekeeper refuses
    # the first run on macOS.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wakewire"]
          end
