version: "2"

# The import graph is the boundary contract (docs/explanation/design-decisions.md
# and the boundaries-backend shape): imports point inward, adapters ->
# application -> domain, inside each context; only the composition root
# (internal/wiring) and other adapters name an adapter; a context's domain
# and application name no other context and no vendor package.
linters:
  enable:
    - depguard
    - errorlint
    - gosec
    - misspell
    - modernize
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        # Text for a person goes through a tabwriter onto a strings.Builder,
        # whose writes cannot fail; the flush is checked.
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true
    gosec:
      excludes:
        - G304 # paths come from wakewire's own home folder or a repository the user named
        - G204 # git, ssh and gh are run by argv, never through a shell
    depguard:
      rules:
        watch-domain:
          files: ["**/internal/watch/domain/**"]
          allow: ["$gostd", "github.com/gperezmz/wakewire/v2/internal/watch/domain"]
          deny:
            - pkg: "github.com/gperezmz/wakewire/v2/internal"
              desc: a domain imports nothing of wakewire's but itself
            - pkg: "github.com/"
              desc: a domain names no vendor package
            - pkg: "golang.org/x/"
              desc: a domain names no vendor package
            - pkg: "modernc.org/"
              desc: a domain names no vendor package
            - pkg: "os"
              desc: a domain does not reach outside the process
            - pkg: "os/exec"
              desc: a domain does not reach outside the process
            - pkg: "os/signal"
              desc: a domain does not reach outside the process
            - pkg: "net"
              desc: a domain does not reach outside the process
            - pkg: "net/http"
              desc: a domain does not reach outside the process
            - pkg: "database/sql"
              desc: a domain does not reach outside the process
            - pkg: "syscall"
              desc: a domain does not reach outside the process
            - pkg: "io/fs"
              desc: a domain does not reach outside the process
            - pkg: "path/filepath"
              desc: a domain does not reach outside the process
        watch-application:
          files: ["**/internal/watch/application/**"]
          allow: ["$gostd", "github.com/gperezmz/wakewire/v2/internal/watch/domain", "github.com/gperezmz/wakewire/v2/internal/watch/application"]
          # The allow list is the contract for the module and for vendors: a deny
          # on github.com/ would also refuse the context's own domain.
          deny:
            - pkg: "golang.org/x/"
              desc: application names no vendor package
            - pkg: "modernc.org/"
              desc: application names no vendor package
            - pkg: "os"
              desc: application reaches outside the process only through a port
            - pkg: "os/exec"
              desc: application reaches outside the process only through a port
            - pkg: "os/signal"
              desc: application reaches outside the process only through a port
            - pkg: "net"
              desc: application reaches outside the process only through a port
            - pkg: "net/http"
              desc: application reaches outside the process only through a port
            - pkg: "database/sql"
              desc: application reaches outside the process only through a port
            - pkg: "syscall"
              desc: application reaches outside the process only through a port
            - pkg: "io/fs"
              desc: application reaches outside the process only through a port
            - pkg: "path/filepath"
              desc: application reaches outside the process only through a port
        watch-adapters:
          files: ["**/internal/watch/adapters/**"]
          deny:
            - pkg: "github.com/gperezmz/wakewire/v2/internal/account/domain"
              desc: the account context's domain is its own; cross through its application
            - pkg: "github.com/gperezmz/wakewire/v2/internal/account/adapters"
              desc: an adapter does not import another context's adapters, the transport or the root
            - pkg: "github.com/gperezmz/wakewire/v2/internal/cli"
              desc: an adapter does not import another context's adapters, the transport or the root
            - pkg: "github.com/gperezmz/wakewire/v2/internal/wiring"
              desc: an adapter does not import another context's adapters, the transport or the root
        account-domain:
          files: ["**/internal/account/domain/**"]
          allow: ["$gostd", "github.com/gperezmz/wakewire/v2/internal/account/domain"]
          deny:
            - pkg: "github.com/gperezmz/wakewire/v2/internal"
              desc: a domain imports nothing of wakewire's but itself
            - pkg: "github.com/"
              desc: a domain names no vendor package
            - pkg: "golang.org/x/"
              desc: a domain names no vendor package
            - pkg: "modernc.org/"
              desc: a domain names no vendor package
            - pkg: "os"
              desc: a domain does not reach outside the process
            - pkg: "os/exec"
              desc: a domain does not reach outside the process
            - pkg: "os/signal"
              desc: a domain does not reach outside the process
            - pkg: "net"
              desc: a domain does not reach outside the process
            - pkg: "net/http"
              desc: a domain does not reach outside the process
            - pkg: "database/sql"
              desc: a domain does not reach outside the process
            - pkg: "syscall"
              desc: a domain does not reach outside the process
            - pkg: "io/fs"
              desc: a domain does not reach outside the process
            - pkg: "path/filepath"
              desc: a domain does not reach outside the process
        account-application:
          files: ["**/internal/account/application/**"]
          # The allow list is the contract for the module and for vendors: a deny
          # on github.com/ would also refuse the context's own domain.
          allow: ["$gostd", "github.com/gperezmz/wakewire/v2/internal/account/domain", "github.com/gperezmz/wakewire/v2/internal/account/application"]
          deny:
            - pkg: "golang.org/x/"
              desc: application names no vendor package
            - pkg: "modernc.org/"
              desc: application names no vendor package
            - pkg: "os"
              desc: application reaches outside the process only through a port
            - pkg: "os/exec"
              desc: application reaches outside the process only through a port
            - pkg: "os/signal"
              desc: application reaches outside the process only through a port
            - pkg: "net"
              desc: application reaches outside the process only through a port
            - pkg: "net/http"
              desc: application reaches outside the process only through a port
            - pkg: "database/sql"
              desc: application reaches outside the process only through a port
            - pkg: "syscall"
              desc: application reaches outside the process only through a port
            - pkg: "io/fs"
              desc: application reaches outside the process only through a port
            - pkg: "path/filepath"
              desc: application reaches outside the process only through a port
        account-adapters:
          files: ["**/internal/account/adapters/**"]
          deny:
            - pkg: "github.com/gperezmz/wakewire/v2/internal/watch/domain"
              desc: the watch context's domain is its own; cross through its application
            - pkg: "github.com/gperezmz/wakewire/v2/internal/watch/adapters"
              desc: an adapter does not import another context's adapters, the transport or the root
            - pkg: "github.com/gperezmz/wakewire/v2/internal/cli"
              desc: an adapter does not import another context's adapters, the transport or the root
            - pkg: "github.com/gperezmz/wakewire/v2/internal/wiring"
              desc: an adapter does not import another context's adapters, the transport or the root
        transport:
          files: ["**/internal/cli/**"]
          deny:
            - pkg: "github.com/gperezmz/wakewire/v2/internal/watch/adapters"
              desc: the transport mounts what the composition root built
            - pkg: "github.com/gperezmz/wakewire/v2/internal/account/adapters"
              desc: the transport mounts what the composition root built

  exclusions:
    rules:
      # Debt, owed knowingly: the record, verify and wiring tests of a source
      # read the stored token through the account service, which only the
      # composition root builds. They run as external test packages, so no
      # production code imports the root; clearing this needs a test kit
      # that builds the account service outside internal/wiring.
      - path: internal/watch/adapters/.*_test\.go
        linters: [depguard]
        text: internal/wiring
      # The record tests write recordings to fixed testdata paths, edit files
      # in the sandbox clone they were pointed at, and reach the sandbox the
      # environment names.
      - path: _test\.go
        linters: [gosec]
        text: G70[34]

formatters:
  enable:
    - gofmt
